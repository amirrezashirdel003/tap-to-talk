<!doctype html>
<html lang="fa-IR" dir="rtl">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="apple-touch-icon" href="/icon-192.png" />
    <meta name="theme-color" content="#3b82f6" />
    <meta
      name="description"
      content="ارتباط تصویری و گفتار فارسی با قابلیت استفاده آفلاین"
    />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Tap to Talk</title>
    <style>
      #startup-screen {
        position: fixed;
        inset: 0;
        z-index: 9999;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 16px;
        background: #f8fafc;
        color: #1e3a8a;
        font-family: system-ui, sans-serif;
        font-size: 1.125rem;
        font-weight: 700;
      }

      #startup-screen img {
        width: 80px;
        height: 80px;
        border-radius: 20px;
        animation: startup-logo-pulse 1.2s ease-in-out infinite alternate;
      }

      @keyframes startup-logo-pulse {
        to {
          transform: scale(1.06);
        }
      }

      @media (prefers-reduced-motion: reduce) {
        #startup-screen img {
          animation: none;
        }
      }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <div id="startup-screen" role="status" aria-live="polite">
      <img src="/icon-192.png" alt="" />
      <span>تپ تو تاک</span>
    </div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
